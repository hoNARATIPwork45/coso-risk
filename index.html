<style>
:root{--cream:#f4eee2;--muted:#c3b9a8;--gold:#cfad77;--hair:rgba(232,217,190,.32);--col:36.25vw;--body:clamp(17px,1.45vw,21px)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#131310;color:var(--cream);font-family:"IBM Plex Sans Thai","Anuphan",system-ui,sans-serif;font-variant-numeric:tabular-nums}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:5px}button:disabled{opacity:.25;cursor:default}
#world{position:fixed;inset:0;width:100%;height:100%;display:block}.scrim{position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(12,13,11,.97),rgba(12,13,11,.87) 29%,rgba(12,13,11,.42) 47%,transparent 69%);transition:opacity .45s}body.right .scrim{background:linear-gradient(270deg,rgba(12,13,11,.95),rgba(12,13,11,.88) 28%,rgba(12,13,11,.43) 47%,transparent 72%)}
.slide{position:fixed;inset:0;visibility:hidden;opacity:0;transition:opacity .35s;pointer-events:none}.slide.active{visibility:visible;opacity:1}.slide header,.slide main,.slide footer{position:absolute;left:6.5vw;width:var(--col)}.slide.right header,.slide.right main,.slide.right footer{left:50vw}.slide header{top:7vh;height:40px;border-bottom:1px solid var(--hair);display:flex;align-items:flex-start;gap:24px;font-size:12px}.slide .num{font-family:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;font-weight:600;letter-spacing:.12em;color:var(--gold)}.category{color:var(--muted);font-weight:400}.principles{margin-left:auto;color:var(--muted)}.slide main{top:26vh}.slide h1,.slide h2{font-family:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;font-size:clamp(42px,4.4vw,64px);font-weight:700;line-height:1.28;text-wrap:balance;margin:0;letter-spacing:0}.slide h1{font-size:clamp(54.6px,5.72vw,83.2px)}.english{font-size:13px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:16px 0 32px;line-height:1.6}.slide ul{list-style:none;padding:0;margin:0;display:grid;gap:16px;font-size:var(--body);line-height:1.55}.slide li{position:relative;padding-left:34px}.slide li:before{content:"";position:absolute;left:0;top:.79em;width:18px;height:1px;background:var(--gold)}.slide footer{bottom:9vh;border-top:1px solid var(--hair);padding-top:16px;display:flex;gap:16px;justify-content:space-between;align-items:flex-start;font-size:14px;line-height:1.55;color:var(--muted)}footer .count{white-space:nowrap;font-family:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;font-weight:600;color:var(--gold)}.metrics{display:flex;gap:32px;margin:-8px 0 24px}.metric strong{font-family:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;font-size:clamp(48px,5vw,76px);font-weight:700;line-height:1.05;display:block}.metric span{font-size:14px;color:var(--muted)}.steps{display:flex;align-items:flex-start;margin:24px 0;gap:8px;font-size:14px;color:var(--cream)}.step{flex:1;position:relative;line-height:1.5}.step:before{content:"";display:block;width:7px;height:7px;background:var(--gold);border-radius:50%;margin-bottom:8px}.step:not(:last-child):after{content:"";position:absolute;top:3px;left:15px;right:0;height:1px;background:var(--hair)}
#rail{filter:drop-shadow(0 1px 3px #000);position:fixed;right:16px;top:32%;width:10vw;max-width:144px;display:grid;gap:16px;z-index:5}#rail button{padding:0;border:0;background:none;text-align:right;font-size:11px;line-height:1.35;color:#a69c8c;display:flex;justify-content:flex-end;gap:8px;align-items:center}#rail button:after{content:"";height:4px;width:4px;flex:none;border-radius:50%;background:#736c61}#rail button[aria-current="step"]{color:var(--cream)}#rail button[aria-current="step"]:after{background:var(--gold);height:16px;border-radius:2px}.controls{position:fixed;bottom:24px;left:6.5vw;right:6.5vw;display:flex;justify-content:space-between;align-items:center;z-index:10}.tools,.paging{display:flex;align-items:center;gap:24px}.controls button{border:0;background:none;padding:8px 0;font-size:12px}.controls kbd{font:inherit;color:var(--gold);border:1px solid var(--hair);border-radius:4px;padding:3px 6px;margin-right:8px}.hint{font-size:11px;color:#a69c8c}.paging button{font-size:14px}.paging #next{color:var(--gold)}#progress{position:fixed;left:0;bottom:0;height:2px;width:12.5%;background:var(--gold);transition:width .6s}#notes{position:fixed;z-index:30;inset:12vh 16vw;background:#1e201bf5;border:1px solid var(--hair);padding:40px;overflow:auto;box-shadow:0 24px 100px #000a;border-radius:4px}#notes[hidden]{display:none}#notes h2{font-family:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;font-size:28px;margin:0 0 24px}#notes p,#notes li{font-size:18px;line-height:1.8}#notes a{color:var(--gold)}#close-notes{float:right;background:none;border:0;font-size:24px}#notes small{display:block;color:var(--muted);margin-bottom:16px}#status{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);max-width:80vw;z-index:40;font-size:13px;color:var(--muted);text-align:center;background:#151611e6;padding:8px 16px;border-radius:4px}#status:empty{display:none}.scene-caption{position:fixed;top:7vh;left:55vw;color:#b3a58b;letter-spacing:.15em;font-size:10px;pointer-events:none}body.right .scene-caption{left:6.5vw}.fade .slide.active{opacity:0}.fade .scene-caption{opacity:0}
@media(max-width:1100px){#rail{width:9vw;right:8px}#rail button{font-size:10px}.slide.right header,.slide.right main,.slide.right footer{left:49vw}.english{margin-bottom:24px}.slide ul{gap:16px}.metrics{gap:24px}.hint{display:none}}

@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
#fullscreen-help{color:var(--cream);background:#20221e;border:1px solid var(--hair);border-radius:8px;padding:32px;width:min(560px,90vw);max-height:85vh;overflow:auto;font-family:"IBM Plex Sans Thai","Anuphan",system-ui,sans-serif}#fullscreen-help::backdrop{background:#000b}#fullscreen-help h2{font:600 24px/1.4 "Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;margin:0 0 16px}#fullscreen-help p{line-height:1.7;margin:16px 0}#fullscreen-help button{background:none;border:1px solid var(--hair);border-radius:4px;padding:8px 16px;margin:8px 8px 0 0}#fullscreen-help input{display:block;width:100%;font:12px/1.5 "IBM Plex Sans Thai","Anuphan",system-ui,sans-serif;color:var(--cream);background:#121410;border:1px solid var(--hair);padding:8px}#fullscreen-help .help-close{float:right;margin:0;border:0;padding:0 8px;font-size:24px}
@media(max-width:760px){.controls .tools{gap:8px}.controls{left:4vw;right:4vw}.paging{gap:12px}#notes-button{font-size:0}#notes-button kbd{font-size:11px}#render-mode{font-size:10px}}

<script>
const slides=[
{title:'ความเสี่ยง<br>คืออะไร',en:'Risk · Every decision has a consequence',cat:'',name:'หอไม้แห่งความเสี่ยง',caption:'01 / THE BALANCING ACT',bullets:['สิ่งที่อาจเกิด แล้วทำให้ไปไม่ถึงเป้าหมาย','ไม่ได้แปลว่าเรื่องร้ายเสมอไป','โอกาสที่ปล่อยหลุดมือ ก็คือความเสี่ยง','ทุกการตัดสินใจมีความเสี่ยงติดมา'],compare:'ดึงบล็อกไหน ตึกถึงจะไม่ล้ม',notes:'เริ่มจากถามผู้ฟังว่า ถ้าต้องดึงไม้หนึ่งชิ้น จะเลือกชิ้นไหน และมองอะไรประกอบการเลือก? เป้าหมายคือให้หอยังคงตั้งอยู่ ความเสี่ยงเกิดจากความไม่แน่นอนของผลที่ตามมา ไม่ใช่ตัวบล็อกเพียงอย่างเดียว<br><br>ในมุมของกรอบนี้ ความเสี่ยงคือความเป็นไปได้ที่เหตุการณ์จะเกิดและกระทบการบรรลุกลยุทธ์หรือวัตถุประสงค์ ผลอาจดีกว่าหรือแย่กว่าที่คาด การบริหารความเสี่ยงจึงช่วยให้เลือกได้ดีขึ้น รวมถึงมองเห็นโอกาสที่ควรคว้า ไม่ใช่หลีกเลี่ยงทุกอย่าง'},
{title:'รู้จักกรอบ<br>บริหารความเสี่ยง',en:'COSO ERM · The Framework',cat:'ภาพรวมของกรอบ',name:'โต๊ะสถาปนิก',caption:'02 / A BLUEPRINT FOR DECISIONS',metrics:true,bullets:['กรอบบริหารความเสี่ยงที่องค์กรทั่วโลกใช้','ฉบับ 2017 ใช้ความเสี่ยงตอนเลือกกลยุทธ์','ไม่ใช่ตอนตามแก้ปัญหาทีหลัง'],compare:'5 ห้องถัดไป คือ 5 องค์ประกอบนี้',notes:'COSO คือ Committee of Sponsoring Organizations of the Treadway Commission ส่วน ERM คือ Enterprise Risk Management หรือการบริหารความเสี่ยงทั่วทั้งองค์กร<br><br>ชื่อกรอบฉบับ 2017 คือ Enterprise Risk Management—Integrating with Strategy and Performance มี 5 องค์ประกอบ และ 20 หลักการ เชื่อมความเสี่ยงเข้ากับการเลือกกลยุทธ์และการดำเนินงาน องค์ประกอบเหล่านี้ต้องทำงานร่วมกัน ไม่ใช่ลำดับงานที่ทำครั้งเดียวแล้วจบ<br><br>แบบจำลองอาคารเปรียบเหมือนกลยุทธ์ แบบแปลนช่วยให้เห็นความเชื่อมโยงก่อนลงมือสร้าง'},
{title:'การกำกับดูแล<br>และวัฒนธรรม',en:'Governance & Culture',cat:'องค์ประกอบที่ 1',range:'1–5',name:'ห้องประชุมบอร์ด',caption:'03 / THE PEOPLE BEHIND THE CHOICES',bullets:['ใครตัดสินใจ ใครรับผิดชอบ','วัฒนธรรมที่กล้าบอกข่าวร้าย','ค่านิยมที่ผู้บริหารทำให้ดู','คนที่มีความสามารถพอ'],compare:'กติกาของบ้าน กับนิสัยของคนในบ้าน',notes:'หลักการ 1–5 ครอบคลุมการกำกับความเสี่ยงโดยคณะกรรมการ โครงสร้างการดำเนินงาน วัฒนธรรมที่ต้องการ การยึดมั่นค่านิยมหลัก และการดึงดูด พัฒนา และรักษาคนที่มีความสามารถ<br><br>ตัวอย่าง: ทีมพบว่ากำหนดส่งสินค้าอาจไม่ทัน หากการแจ้งข่าวร้ายทำให้ถูกตำหนิ ปัญหาจะถูกซ่อน ผู้บริหารจึงควรเปิดพื้นที่ให้แจ้งเร็ว กำหนดผู้รับผิดชอบ และแสดงพฤติกรรมที่สอดคล้องกับค่านิยม'},
{title:'กลยุทธ์และ<br>วัตถุประสงค์',en:'Strategy & Objective-Setting',cat:'องค์ประกอบที่ 2',range:'6–9',name:'ทางแยกของกลยุทธ์',caption:'04 / CHOOSE THE ROAD',bullets:['เลือกเส้นทางก่อนออกเดินทาง','ดูบริบทธุรกิจให้ชัดก่อน','กำหนดระดับความเสี่ยงที่ยอมรับได้','เทียบทางเลือกกลยุทธ์ก่อนตัดสินใจ'],compare:'งบที่ยอมเสียได้ โดยไม่เจ็บตัว',notes:'หลักการ 6–9 คือวิเคราะห์บริบทธุรกิจ กำหนดระดับความเสี่ยงที่ยอมรับได้ ประเมินกลยุทธ์ทางเลือก และกำหนดวัตถุประสงค์ทางธุรกิจ<br><br>Risk Appetite หมายถึงประเภทและระดับความเสี่ยงที่องค์กรยินดีรับเพื่อสร้างคุณค่า คำเปรียบเทียบเรื่องงบเป็นเพียงตัวอย่างเบื้องต้น ยังครอบคลุมชื่อเสียง ความปลอดภัย คุณภาพ และเรื่องอื่น ๆ ไม่ใช่แค่จำนวนเงินที่ยอมเสีย<br><br>ตัวอย่าง: ก่อนเปิดสาขาใหม่ ให้เทียบการเปิดเอง การร่วมทุน และการขายออนไลน์ พร้อมกำหนดเป้าหมายที่วัดได้และขอบเขตที่ยอมรับ'},
{title:'ผลการดำเนินงาน',en:'Performance',cat:'องค์ประกอบที่ 3',range:'10–14',name:'โต๊ะประเมินความเสี่ยง',caption:'05 / MAKE RISK VISIBLE',steps:['ระบุ','ประเมิน','จัดลำดับ','ตอบสนอง','ภาพรวม'],bullets:['ประเมิน = โอกาสเกิด × ผลกระทบ','ตอบสนอง 5 ทาง: ยอมรับ / หลีกเลี่ยง / ลด / แบ่งปัน / แสวงหา'],compare:'เห็นหลุมข้างหน้า แล้วเลือกว่าจะหลบหรือชะลอ',notes:'หลักการ 10–14 คือระบุความเสี่ยง ประเมินความรุนแรง จัดลำดับความสำคัญ เลือกและดำเนินการตอบสนอง และมองความเสี่ยงในภาพรวมขององค์กร<br><br>การคูณโอกาสเกิดกับผลกระทบเป็นวิธีให้คะแนนอย่างง่ายเพื่อเริ่มพูดคุย ไม่ใช่สูตรบังคับของ COSO และคะแนนอันดับไม่ใช่ค่าความเสียหายจริง ควรดูความเร็วของเหตุการณ์ ความเชื่อมโยง และข้อจำกัดของข้อมูลด้วย ตารางนี้เป็นตัวอย่างประกอบการเรียน ไม่ใช่เกณฑ์สากล<br><br>การตอบสนอง: ยอมรับเมื่ออยู่ในขอบเขตที่รับได้ หลีกเลี่ยงโดยหยุดกิจกรรม ลดด้วยมาตรการ แบ่งปันด้วยประกันหรือคู่สัญญา และแสวงหาเมื่อความเสี่ยงที่เพิ่มขึ้นเปิดโอกาสคุ้มค่า หลังตอบสนองต้องมองความเสี่ยงที่ยังเหลือและความเสี่ยงร่วมกันทั้งองค์กร'},

{title:'สารสนเทศ<br>และการสื่อสาร',en:'Information, Communication & Reporting',cat:'องค์ประกอบที่ 5',range:'18–20',name:'ห้องควบคุม',caption:'07 / THE RIGHT SIGNAL, IN TIME',bullets:['ข้อมูลถึงคนที่ต้องตัดสินใจ ทันเวลา','ไหลได้ทั้งขึ้น ลง และข้ามฝ่าย','ใช้ระบบช่วย ไม่ใช่รอรายงานปีละครั้ง'],compare:'ไฟเตือนน้ำมันใกล้หมด ไม่ใช่ตอนรถดับแล้ว',notes:'ชื่อองค์ประกอบเต็มครอบคลุมสารสนเทศ การสื่อสาร และการรายงาน หลักการ 18–20 คือใช้สารสนเทศและเทคโนโลยี สื่อสารข้อมูลความเสี่ยง และรายงานความเสี่ยง วัฒนธรรม และผลการดำเนินงาน<br><br>ตัวอย่าง: ผู้จัดการได้รับสัญญาณเตือนสินค้าคงเหลือน้อยก่อนของหมด ฝ่ายจัดซื้อและฝ่ายขายเห็นข้อมูลเดียวกัน และมีช่องทางส่งเรื่องถึงผู้ตัดสินใจ<br><br>จอจำนวนมากไม่ได้รับประกันว่าข้อมูลดี ต้องมีข้อมูลน่าเชื่อถือ ทันเวลา และบอกได้ว่าใครต้องทำอะไรต่อ'},
